# Sources interrogées automatiquement.
# Toutes sont des points d'accès PUBLICS que les sites eux-mêmes servent à leurs pages carrières
# (aucune connexion, aucun contournement). Vérifiées le 25 novembre 2026.
#
# Ajouter une organisation sur Workday : ouvrir sa page carrières, l'adresse a la forme
#   https://<tenant>.<wdN>.myworkdayjobs.com/<site>   → renseigner tenant, serveur (wdN), site.

