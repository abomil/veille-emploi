  - {nom: "PAM / WFP",                tenant: wfp,           serveur: wd3,   site: job_openings}
  - {nom: "HCR / UNHCR",              tenant: unhcr,         serveur: wd3,   site: External}
  - {nom: "PATH",                     tenant: path,          serveur: wd1,   site: External}
  - {nom: "FHI 360",                  tenant: fhi,           serveur: wd1,   site: FHI_360_External_Career_Portal}
  - {nom: "MSH",                      tenant: msh,           serveur: wd503, site: External}
  - {nom: "IRC",                      tenant: theirc,        serveur: wd1,   site: External_Careers}
  - {nom: "World Vision",             tenant: worldvision,   serveur: wd1,   site: WorldVisionInternational}

